[project]
name = "ai-financial-analyst"
version = "0.1.0"
description = "Enterprise-grade AI Financial Analyst"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Adeeb" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "rich>=13.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.0",
    "redis>=5.0.0",
    "psycopg[binary]>=3.1.0",
    "chromadb>=0.5.0",
    "openai>=1.0.0",
    "yfinance>=0.2.0",
    "qdrant-client>=1.9.0",
    "sentence-transformers>=2.2.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "markdownify>=0.13.0",
    "rank-bm25>=0.2.0",
    "pymupdf>=1.24.0",
    "edgartools>=5.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "pyjwt>=2.8.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
]
document-parsing = [
    "llama-parse>=0.4.0",
    "marker-pdf>=1.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "integration: tests that require real external services (opt-in via TEST_POSTGRES_URL / TEST_REDIS_URL)",
]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
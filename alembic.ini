# Alembic Configuration
# https://alembic.sqlalchemy.org/en/latest/configuration.html

[alembic]
# Template used to generate migration files
# template = alembic/templates

# Path to migration scripts
script_location = alembic

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# Naming convention for version numbers
# https://alembic.sqlalchemy.org/en/latest/autogenerate.html
# version_num_format = %04d

# Authentication database migrations
[alembic_auth]
sqlalchemy.url = sqlite:////tmp/auth.db

# Chat persistence database migrations
[alembic_chat]
sqlalchemy.url = sqlite:////tmp/chat.db
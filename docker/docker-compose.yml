name: ai-financial-analyst

services:

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - ../.env

    environment:
      AUTH_DATABASE_URL: sqlite:///./data/auth.db
      CHAT_DATABASE_URL: sqlite:///./data/chat.db

      QDRANT_URL: http://qdrant:6333

      ENVIRONMENT: production

    depends_on:
      qdrant:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

    volumes:
      - app-data:/app/data

  qdrant:
    image: qdrant/qdrant:latest

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant-data:/qdrant/storage

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  app-data:
  qdrant-data:
